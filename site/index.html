<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121108">
<meta name="color-scheme" content="dark">
<meta name="description" content="Lo que valía la pena no olvidar.">
<title>Frases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* La experiencia es siempre oscura por diseño: cada escena pinta su propia atmósfera. */
  :root{
    --bg:#121108; --ink:#f4eddc; --muted:rgba(244,237,220,.66); --line:rgba(244,237,220,.22); --glass:rgba(18,17,8,.42);
    --accent:#cfc67c;
    --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; overflow:hidden; overscroll-behavior:none; -webkit-font-smoothing:antialiased}
  [hidden]{display:none !important}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--ink); outline-offset:3px}
  .sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

  /* ---------- capas de fondo ---------- */
  #gl,#fx{position:fixed; inset:0; width:100%; height:100%; display:block; pointer-events:none}
  #gl{z-index:0}
  #fx{z-index:1}
  /* respaldo sin WebGL: degradado con los colores de la escena */
  body.no-gl{background:radial-gradient(70% 60% at 70% 35%, var(--cc, #3a3a20) 0%, transparent 70%), linear-gradient(160deg, var(--cb, #2a2a14), var(--ca, #121108))}
  body.no-gl #gl{display:none}

  /* ---------- cabecera mínima: marca e icono de menú ---------- */
  .top{position:fixed; z-index:6; top:0; left:0; right:0; display:flex; align-items:center; justify-content:flex-end; padding:calc(env(safe-area-inset-top, 0px) + 16px) clamp(18px,3vw,34px) 0; pointer-events:none}
  .top > *{pointer-events:auto}
  .glass,.chip,.tool,.round{border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); cursor:pointer; transition:background .2s, color .2s, border-color .2s}
  .glass:hover,.chip:hover,.tool:hover,.round:hover{border-color:var(--ink)}
  .menu-btn{display:grid; place-items:center; width:46px; height:46px; border-radius:50%}
  .menu-btn svg,.round svg{width:20px; height:20px}

  /* ---------- escena ---------- */
  .stage{position:fixed; inset:0; z-index:3; display:grid; place-items:center; padding:calc(84px + env(safe-area-inset-top, 0px)) clamp(22px,7vw,110px) calc(80px + env(safe-area-inset-bottom, 0px))}
  .scene{margin:0; width:100%; max-width:62rem; will-change:transform}
  .cat{display:inline-flex; align-items:center; gap:10px; margin-bottom:1.4rem; font-size:.9rem; letter-spacing:.04em; color:var(--muted); opacity:0; transform:translateY(8px); transition:opacity .8s .1s, transform .8s .1s}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px 2px var(--accent); animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.5); opacity:.7}}

  .quote{margin:0; font-family:var(--serif); font-weight:400; line-height:1.07; letter-spacing:-.02em; text-wrap:balance; text-shadow:0 2px 40px rgba(0,0,0,.45)}
  .quote::before{content:"\201C"; display:block; height:.42em; margin-bottom:.12em; font-size:1.9em; line-height:.9; color:var(--accent); opacity:.6}
  .quote.xl{font-size:clamp(2.9rem,8.2vw,7.2rem)}
  .quote.l {font-size:clamp(2.3rem,6vw,5.2rem)}
  .quote.m {font-size:clamp(1.95rem,4.7vw,3.9rem); line-height:1.1}
  .quote.s {font-size:clamp(1.6rem,3.7vw,3rem); line-height:1.14}
  .quote.xs{font-size:clamp(1.35rem,2.8vw,2.2rem); line-height:1.2}

  .w{display:inline-block; opacity:0; filter:blur(12px); transform:translateY(calc(var(--dir, 1) * .38em));
     transition:opacity .9s cubic-bezier(.2,.7,.2,1), filter .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
     transition-delay:var(--d, 0ms)}
  .scene.in .w{opacity:1; filter:blur(0); transform:none}
  .scene.out .w{opacity:0; filter:blur(9px); transform:translateY(calc(var(--dir, 1) * -.28em)); transition-duration:.42s; transition-delay:calc(var(--d, 0ms) / 4)}
  .scene.in .cat,.scene.in .meta{opacity:1; transform:none}
  .scene.out .cat,.scene.out .meta{opacity:0; transition-duration:.3s; transition-delay:0s}

  .meta{margin-top:1.5rem; opacity:0; transform:translateY(10px); transition:opacity .9s .55s, transform .9s .55s}
  .attr{margin:0; font-size:1.1rem}
  .attr b{font-weight:500}
  .attr i{font-family:var(--serif); font-size:1.18em; color:var(--muted)}
  .extras{display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; margin-top:.5rem; color:var(--muted); font-size:.92rem}
  .tag{background:none; border:0; padding:8px 0; color:var(--muted); cursor:pointer; text-decoration:underline; text-decoration-color:transparent; text-underline-offset:4px; transition:color .2s, text-decoration-color .2s}
  .tag:hover{color:var(--ink); text-decoration-color:var(--accent)}

  /* ---------- contador discreto y pista inicial ---------- */
  .count{position:fixed; z-index:5; left:clamp(18px,3vw,34px); bottom:calc(env(safe-area-inset-bottom, 0px) + 22px); font-variant-numeric:tabular-nums; font-size:.9rem; color:var(--muted); opacity:.7; pointer-events:none}
  .count b{color:var(--ink); font-weight:500}
  .pager{position:fixed; z-index:6; right:clamp(18px,3vw,34px); bottom:calc(env(safe-area-inset-bottom, 0px) + 16px); display:flex; gap:10px}
  .hint{position:fixed; z-index:5; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 20px); transform:translateX(-50%); padding:8px 16px; border-radius:999px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:.85rem; color:var(--muted); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .8s}
  .hint.show{opacity:1}

  /* ---------- menú e índice ---------- */
  .index{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top, 0px) + 16px) clamp(18px,5vw,72px) calc(env(safe-area-inset-bottom, 0px) + 20px); background:rgba(14,13,6,.8); backdrop-filter:blur(18px) saturate(120%); -webkit-backdrop-filter:blur(18px) saturate(120%); animation:fadein .35s both}
  @keyframes fadein{from{opacity:0}}
  .index-head{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; max-width:68rem; align-self:center; margin-bottom:10px}
  .index-head h2{margin:0; font-family:var(--serif); font-weight:400; font-size:2rem}
  .round{display:grid; place-items:center; width:46px; height:46px; border-radius:50%}
  .index-body{flex:1; min-height:0; display:grid; grid-template-columns:minmax(220px,300px) minmax(0,1fr); gap:clamp(22px,5vw,72px); width:100%; max-width:68rem; align-self:center; overflow:hidden}
  .menu-side{overflow-y:auto; padding:4px 2px 14px}
  .menu-side h3{margin:22px 0 10px; font-size:.9rem; font-weight:500; color:var(--muted)}
  .menu-side h3:first-child{margin-top:6px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .note{margin:10px 0 0; font-size:.82rem; line-height:1.45; color:var(--muted)}
  .chip{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 15px; border-radius:999px; font-size:.92rem; white-space:nowrap}
  .chip small{opacity:.6; font-size:.78rem}
  .chip[aria-pressed="true"]{background:var(--ink); color:#121108; border-color:var(--ink)}
  .chip[aria-pressed="true"] small{opacity:.7}
  .actions-col{display:flex; flex-direction:column; align-items:flex-start; gap:8px}
  .tool{display:inline-flex; align-items:center; gap:10px; height:42px; padding:0 16px; border-radius:999px; font-size:.92rem; color:var(--ink)}
  .tool svg{width:17px; height:17px; flex:none}
  .index-list{min-height:0; overflow-y:auto; margin:0; padding:0; list-style:none}
  .index-item{display:grid; grid-template-columns:3rem 1fr; gap:6px 14px; width:100%; padding:16px 4px; text-align:left; background:none; border:0; border-top:1px solid var(--line); cursor:pointer; transition:padding-left .3s, background .3s}
  .index-item:hover,.index-item:focus-visible{padding-left:14px; background:rgba(244,237,220,.05)}
  .index-item[aria-current="true"] .n{color:var(--accent)}
  .index-item .n{font-variant-numeric:tabular-nums; color:var(--muted); padding-top:.5em}
  .index-item .t{font-family:var(--serif); font-size:clamp(1.3rem,3vw,1.9rem); line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .index-item .m{grid-column:2; font-size:.85rem; color:var(--muted)}
  .index-foot{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between; width:100%; max-width:68rem; align-self:center; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem}
  .switch{display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:0; background:none; border:0; color:var(--ink); font-size:.92rem; cursor:pointer}
  .switch .track{width:38px; height:22px; border-radius:999px; background:var(--line); position:relative; transition:background .2s; flex:none}
  .switch .track::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--ink); transition:transform .2s}
  .switch[aria-checked="true"] .track{background:var(--accent)}
  .switch[aria-checked="true"] .track::after{transform:translateX(16px); background:#121108}
  .index-foot .switch{color:var(--muted)}

  .toast{position:fixed; z-index:30; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 28px); transform:translate(-50%, 12px); padding:10px 18px; border-radius:12px; background:var(--ink); color:#121108; font-size:.9rem; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s}
  .toast.show{opacity:1; transform:translate(-50%, 0)}

  /* ---------- móvil ---------- */
  @media (max-width: 860px){
    .index-body{display:block; overflow-y:auto}
    .menu-side{overflow:visible}
    .index-list{overflow:visible}
  }
  @media (max-width: 720px){
    .stage{padding-top:calc(78px + env(safe-area-inset-top, 0px)); padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px))}
    .hint{white-space:normal; width:max-content; max-width:80vw; text-align:center; bottom:calc(env(safe-area-inset-bottom, 0px) + 56px)}
  }
  @media (max-height: 520px) and (orientation: landscape){
    .stage{padding-top:64px; padding-bottom:56px}
    .quote.xl{font-size:clamp(2rem,6vw,3.6rem)} .quote.l{font-size:clamp(1.8rem,5vw,3rem)}
  }

  /* ---------- movimiento reducido ---------- */
  html.rm .w{filter:none; transform:none; transition:opacity .35s}
  html.rm .cat,html.rm .meta{transition:opacity .35s; transform:none}
  html.rm .dot{animation:none}
  html.rm #fx{display:none}
  @media (prefers-reduced-motion: reduce){ .dot{animation:none} }
</style>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="top">
  <button class="glass menu-btn" id="openIndex" type="button" aria-haspopup="dialog" aria-label="Abrir el menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h11"/></svg>
  </button>
</header>

<main class="stage" id="stage">
  <figure class="scene" id="scene">
    <div class="cat"><i class="dot"></i><span id="catName"></span></div>
    <blockquote class="quote" id="quote"></blockquote>
    <figcaption class="meta">
      <p class="attr" id="attr"></p>
      <div class="extras"><span id="tags"></span><time id="date"></time></div>
    </figcaption>
  </figure>
</main>
<p class="sr-only" id="live" aria-live="polite"></p>

<div class="count" id="count" aria-hidden="true"></div>
<nav class="pager" aria-label="Navegar entre frases">
  <button class="round" id="share" type="button" aria-label="Compartir esta frase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5.5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="M8.3 10.7l7.4-3.9M8.3 13.3l7.4 3.9"/></svg></button>
  <button class="round" id="prev" type="button" aria-label="Frase anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 14l-6-6-6 6"/></svg></button>
  <button class="round" id="next" type="button" aria-label="Frase siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10l6 6 6-6"/></svg></button>
</nav>
<div class="hint" id="hint">Desliza, usa las flechas o la rueda del mouse</div>

<div class="index" id="index" role="dialog" aria-modal="true" aria-label="Menú e índice de frases" hidden>
  <div class="index-head">
    <h2>Menú</h2>
    <button class="round" id="closeIndex" type="button" aria-label="Cerrar el menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="index-body">
    <aside class="menu-side">
      <h3>Categorías</h3>
      <div class="chips" id="chips" role="group" aria-label="Filtrar frases"></div>
      <p class="note" id="orderNote"></p>
      <h3>Acciones</h3>
      <div class="actions-col">
        <button class="tool" id="random" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>Frase al azar</button>
        <button class="tool" id="copyText" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0013.5 4h-7A2.5 2.5 0 004 6.5v7A2.5 2.5 0 006.5 16H8"/></svg>Copiar la frase</button>
        <button class="tool" id="copyLink" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3A4 4 0 0011 18.7l1-1"/></svg>Copiar el enlace</button>
        <button class="switch" id="play" type="button" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><span>Reproducción automática</span></button>
      </div>
    </aside>
    <ol class="index-list" id="indexList"></ol>
  </div>
  <div class="index-foot">
    <span id="indexInfo"></span>
    <button class="switch" id="motionSwitch" type="button" role="switch" aria-checked="true"><span class="track" aria-hidden="true"></span><span>Animación</span></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const root = document.documentElement;

/* =====================================================================
   DATOS
   Se cargan desde DATA_URLS (servidor remoto o el frases.json que genera el build).
   Cada frase admite:  text, author, source, category, tags[], date, img, video
   (img y video son opcionales: rutas a las imágenes/videos generados)
   También se entiende el formato del repo: texto, autor, fuente, categoria, fecha.
   ===================================================================== */
// clave de categorias.json → nombre visible; el build lo rellena con las categorías del repo
const CAT_NOMBRES = /*{{CATEGORIAS}}*/{};
const DEFAULT = [
  { id:1, category:'Sin clasificar', text:'Esta frase todavía no tiene categoría: así se ve una que capturaste de apuro.', tags:['pendiente'], date:'2026-09-18' },
  { id:2, category:'Reflexión', text:'No es que tengamos poco tiempo, sino que perdemos mucho.', author:'Séneca', source:'Sobre la brevedad de la vida', tags:['tiempo'], date:'2026-09-18' },
  { id:3, category:'Reflexión', text:'Caminante, no hay camino,\nse hace camino al andar.', author:'Antonio Machado', source:'Proverbios y cantares', tags:['camino'], date:'2026-09-18' },
  { id:4, category:'Libro', text:'La vida sólo puede ser comprendida hacia atrás, pero debe ser vivida hacia adelante.', author:'Søren Kierkegaard', source:'Diarios', tags:['tiempo'], date:'2026-09-18' },
  { id:5, category:'Conversación', text:'El tiempo no cura nada, solo enseña a convivir.', author:'alguien', source:'el bus', tags:[], date:'2026-09-18' }
];

function normalize(raw) {
  const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.frases) ? raw.frases : null);
  if (!arr) throw new Error('formato no reconocido');
  const out = [];
  arr.forEach((r, i) => {
    if (!r || typeof r !== 'object') return;
    const text = String(r.text || r.texto || r.frase || r.quote || '').trim();
    if (!text) return;
    let tags = r.tags || r.etiquetas || [];
    if (typeof tags === 'string') tags = tags.split(/[\s,]+/);
    let cat = (r.category || r.categoria || r.categoría || r.cat || '').toString().trim();
    cat = CAT_NOMBRES[cat] || cat || 'Sin clasificar';
    out.push({
      id: r.id != null ? String(r.id) : String(i + 1),
      text,
      author: (r.author || r.autor || '').toString().trim() || null,
      source: (r.source || r.fuente || r.obra || '').toString().trim() || null,
      cat,
      tags: tags.map(t => String(t).replace(/^#/, '').trim()).filter(Boolean),
      date: parseDate(r.date || r.fecha),
      img: r.img || r.imagen || null,
      video: r.video || null
    });
  });
  if (!out.length) throw new Error('sin frases');
  return out;
}
function parseDate(v) {
  if (!v) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v);
  return isNaN(d) ? null : d;
}
const fmtDate = d => d ? d.toLocaleDateString('es', { day:'numeric', month:'long', year:'numeric' }) : '';

// origen de los datos: primero el servidor, luego un frases.json local, y si nada responde, las frases de arriba
const DATA_URLS = ['http://104.248.224.152/frases.json', 'frases.json'];
// las rutas relativas de img/video se resuelven contra el JSON del que vienen, no contra esta página
function absolutize(list, base) {
  const abs = u => { if (!u || /^data:/.test(u)) return u; try { return new URL(u, base).href; } catch (e) { return u; } };
  list.forEach(f => { f.img = abs(f.img); f.video = abs(f.video); });
  return list;
}
async function loadData() {
  for (const url of DATA_URLS) {
    try {
      const r = await fetch(url, { cache:'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return absolutize(normalize(await r.json()), r.url || new URL(url, location.href).href);
    } catch (e) { console.warn('No se pudo cargar ' + url + ':', e.message); }
  }
  return normalize(DEFAULT);
}

/* =====================================================================
   ATMÓSFERAS: cada categoría tiene su paleta, su movimiento y su clima.
   Una categoría nueva recibe una paleta propia generada a partir de su nombre.
   ===================================================================== */
const PAL = {
  'Reflexión':      { a:'#071826', b:'#1f5f80', c:'#f4b36a', d:'#46d6d0', flow:.55, scale:1.0,  warp:1.0,  fx:'motes' },
  'Libro':          { a:'#170d06', b:'#7a431c', c:'#f0c97f', d:'#c4503a', flow:.50, scale:1.25, warp:.9,   fx:'ash'   },
  'Conversación':   { a:'#0a0c1a', b:'#4a3396', c:'#ff7b5c', d:'#4a8cff', flow:.80, scale:.9,   warp:1.15, fx:'rain'  },
  'Canción':        { a:'#14061a', b:'#7a1f5c', c:'#ffb36b', d:'#c86bff', flow:.70, scale:.95,  warp:1.1,  fx:'motes' },

  const r = rip[ripI]; ripI ^= 1; r.x = e.clientX / innerWidth; r.y = 1 - e.clientY / innerHeight; r.a = 0; dirty = true;
}, { passive:true });
window.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; mouse.active = true; mouse.tx = e.clientX / innerWidth; mouse.ty = e.clientY / innerHeight; }, { passive:true });
document.addEventListener('pointerleave', () => { mouse.active = false; });
window.addEventListener('hashchange', () => { const i = view.findIndex(f => f.id === decodeURIComponent(location.hash.slice(1))); if (i >= 0 && i !== idx) go(i, i < idx ? 'prev' : 'next'); });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { resizeGL(); fxResize(); dirty = true; }, 100); });
if (mq.addEventListener) mq.addEventListener('change', e => { let s = null; try { s = localStorage.getItem('frases-motion'); } catch (er) {} if (!s) { reduced = e.matches; applyMotion(); } });

/* =====================================================================

(async function init() {
  all = await loadData();
  applyFilter(); buildChips(); buildIndex();
  const fromHash = view.findIndex(f => f.id === decodeURIComponent(location.hash.slice(1)));
  idx = fromHash >= 0 ? fromHash : 0;
  const f = view[idx];
  setLook(f, true); FX.want = FX.mode = lookFor(f).fx;
  renderScene(f); syncIndex();

  try { GLS = initGL(); resizeGL(); } catch (err) { console.warn('Fondo sin WebGL:', err.message); fallbackCss(); fade = 1; }
  fxResize(); fxReset(FX.mode);
  applyMotion();
  requestAnimationFrame(frame);

  await sleep(reduced ? 50 : 500);                       // entrada: el fondo aparece y luego las palabras
  sceneEl.classList.add('in');
  setMedia(f); preloadNeighbours();
  if (!reduced) setTimeout(() => hint.classList.add('show'), 1800), setTimeout(() => hint.classList.remove('show'), 7500);
  scheduleAuto();
})();
})();
